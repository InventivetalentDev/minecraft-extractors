name: Extract Minecraft datasets
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Minecraft version
        type: string
        required: true
      dataset:
        description: Dataset to extract (see README for supported releases)
        type: choice
        options: [all, entity-models, minerender-data]
        default: all
      verify-reproducibility:
        description: Extract again offline and compare outputs byte for byte
        type: boolean
        default: false
      publish:
        description: Publish validated data to the destination repositories (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: extract-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check publishing branch
        if: inputs.publish && github.ref != 'refs/heads/main'
        run: |
          echo 'Publishing is allowed only from main.' >&2
          exit 1
      - name: Resolve the required Java version
        id: version
        env:
          MC_VERSION: ${{ inputs.version }}
        run: |
          node tools/versions.js --version "$MC_VERSION" > "$RUNNER_TEMP/minecraft-version.json"
          echo "java=$(jq -r '.include[0].java' "$RUNNER_TEMP/minecraft-version.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ steps.version.outputs.java }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/minecraft-extractors
          key: minecraft-${{ runner.os }}-${{ inputs.version }}-${{ hashFiles('lib/download.js', 'lib/runtime.js') }}
      - run: node --test
      - name: Extract and validate datasets
        env:
          MC_VERSION: ${{ inputs.version }}
          DATASET: ${{ inputs.dataset }}
        run: |
          node tools/extract.js --version "$MC_VERSION" --dataset "$DATASET" --output out/first
      - name: Verify reproducibility
        if: inputs.verify-reproducibility
        env:
          MC_VERSION: ${{ inputs.version }}
          DATASET: ${{ inputs.dataset }}
        run: |
          node tools/extract.js --version "$MC_VERSION" --dataset "$DATASET" --output out/second --offline
          diff -r out/first out/second
      - name: Save validated datasets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: minecraft-${{ inputs.version }}-${{ inputs.dataset }}
          path: out/first/
          retention-days: 3
          if-no-files-found: error
      - name: Create a token for the data repositories
        if: inputs.publish
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          owner: InventivetalentDev
          repositories: |
            minecraft-entity-models
            minerender-data
          permission-contents: write
      - name: Check out the entity data repository
        if: inputs.publish && inputs.dataset != 'minerender-data'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: InventivetalentDev/minecraft-entity-models
          path: out/repositories/entity-models
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - name: Check out the registry data repository
        if: inputs.publish && inputs.dataset != 'entity-models'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: InventivetalentDev/minerender-data
          path: out/repositories/minerender-data
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - name: Publish selected datasets
        if: inputs.publish
        env:
          MC_VERSION: ${{ inputs.version }}
          DATASET: ${{ inputs.dataset }}
          DATASET_PURGE_TOKEN: ${{ secrets.DATASET_PURGE_TOKEN }}
        run: |
          for dataset in entity-models minerender-data; do
            if [ "$DATASET" = all ] || [ "$DATASET" = "$dataset" ]; then
              git -C "out/repositories/$dataset" config user.name 'github-actions[bot]'
              git -C "out/repositories/$dataset" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              node tools/publish.js --dataset "$dataset" --version "$MC_VERSION" --input "out/first/$dataset" --repository "out/repositories/$dataset" --push
            fi
          done
